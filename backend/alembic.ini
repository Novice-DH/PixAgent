# Alembic config (ASCII only: configparser uses the locale codec on Windows,
# non-ASCII comments break `alembic` commands on GBK consoles).
# The DB URL is NOT stored here -- migrations/env.py injects it at runtime
# from the app settings (.env is the single source of truth).
[alembic]
script_location = migrations
prepend_sys_path = .
# timestamp-prefixed revision filenames sort chronologically
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
