[project]
name = "pixagent-backend"
version = "0.1.0"
description = "AI 修图智能体（PixAgent）后端"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "arq>=0.26",
    "redis>=5.0",
    "boto3>=1.35",
    "pillow>=10.4",
    "python-multipart>=0.0.9",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
cv = [
    "rembg>=2.0",
    "onnxruntime>=1.18",
    "opencv-python-headless>=4.10",
    "rapidocr-onnxruntime>=1.3",
]
agent = [
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
